name: Endianness Tests

on: workflow_dispatch

permissions:
  contents: read

jobs:
  endianness_tests:
    name: Endianness Tests (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            endian: little
          - arch: s390x
            endian: big
    steps:
    - name: Repository Checkout
      uses: actions/checkout@v7
    - name: QEMU Setup
      if: matrix.arch == 's390x'
      uses: docker/setup-qemu-action@v4
      with:
        platforms: s390x
    - name: Endianness Verification
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p Results
        docker run --rm \
          --platform linux/${{ matrix.arch }} \
          -v "$PWD:/workspace:ro" \
          -v "$PWD/Results:/results" \
          -e EXPECTED_ENDIAN=${{ matrix.endian }} \
          -w /workspace \
          python:3.13-slim \
          python3 -c '
        import os, sys, runpy
        expected = os.environ["EXPECTED_ENDIAN"]
        actual = sys.byteorder
        print(f"Architecture endianness: {actual}", flush=True)
        if actual != expected:
            raise RuntimeError(f"Expected {expected}, got {actual}")
        runpy.run_path("Solution/FastHashes.Tests/endianness_tests.py", run_name="__main__")
        ' | tee Results/output.txt
    - name: Results Artifact Upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: endianness-${{ matrix.arch }}
        path: Results/
        if-no-files-found: warn