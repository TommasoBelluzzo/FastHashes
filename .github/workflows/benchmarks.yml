name: Benchmarks

on: workflow_dispatch

permissions:
  contents: read

defaults:
  run:
    working-directory: Solution

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
    - name: Repository Checkout
      uses: actions/checkout@v7
    - name: .NET Setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      run: >-
        dotnet restore
        FastHashes.sln
        --force-evaluate
    - name: Build
      run: >-
        dotnet build
        FastHashes.sln
        --configuration Release
        --no-restore
        --no-incremental
        --verbosity normal
    - name: Benchmarks Run
      shell: bash
      run: |
        mkdir -p Benchmarks
        dotnet run \
          --project FastHashes.Benchmarks/FastHashes.Benchmarks.csproj \
          --framework net10.0 \
          --configuration Release \
          --no-restore \
          --no-build \
          | tee Benchmarks/results.txt
    - name: Benchmarks Result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Benchmark Results
        path: Solution/Benchmarks/results.txt
        if-no-files-found: warn