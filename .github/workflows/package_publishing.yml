name: Package Publishing

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: 'Target:'
        required: true
        options:
        - MAJOR
        - MINOR
        - RELEASE
        default: 'MINOR'

concurrency:
  group: package-publishing
  cancel-in-progress: false

jobs:
  package_publishing:
    name: Package Publishing
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - name: NuGet Login
      id: login
      uses: NuGet/login@v1
      with:
        user: TommasoBelluzzo
    - name: Repository Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: true
    - name: Version Bump
      id: bump
      shell: bash
      env:
        TARGET: ${{ github.event.inputs.target }}
        VERSION_FILE: Solution/Directory.Build.props
      run: |
        set -euo pipefail
        VERSION_REGEX='<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>'
        MATCH_COUNT=$(grep -Ec "$VERSION_REGEX" "$VERSION_FILE" || true)
        if [[ "$MATCH_COUNT" -ne 1 ]]; then
          echo "INVALID VERSION DECLARATION ($MATCH_COUNT MATCHES)"
          exit 1
        fi
        VERSION=$(grep -Po '(?<=<Version>)[0-9]+\.[0-9]+\.[0-9]+(?=</Version>)' "$VERSION_FILE")
        VERSION_MAJOR=$(echo "$VERSION" | cut -d "." -f1)
        VERSION_MINOR=$(echo "$VERSION" | cut -d "." -f2)
        VERSION_RELEASE=$(echo "$VERSION" | cut -d "." -f3)
        TARGET="${TARGET^^}"
        if [[ "$TARGET" == "MAJOR" ]]; then
          VERSION_MAJOR=$((VERSION_MAJOR + 1))
          VERSION_MINOR=0
          VERSION_RELEASE=0
        elif [[ "$TARGET" == "MINOR" ]]; then
          VERSION_MINOR=$((VERSION_MINOR + 1))
          VERSION_RELEASE=0
        elif [[ "$TARGET" == "RELEASE" ]]; then
          VERSION_RELEASE=$((VERSION_RELEASE + 1))
        else
          echo "INVALID TARGET ($TARGET)"
          exit 1
        fi
        VERSION=$(printf "%d.%d.%d" "$VERSION_MAJOR" "$VERSION_MINOR" "$VERSION_RELEASE")
        ASSEMBLY_VERSION="$VERSION_MAJOR.0.0.0"
        FILE_VERSION="$VERSION.0"
        sed -i -E \
          "s#<Version>[0-9]+\.[0-9]+\.[0-9]+</Version>#<Version>$VERSION</Version>#" \
          "$VERSION_FILE"
        sed -i -E \
          "s#<FileVersion>[0-9]+(\.[0-9]+){3}</FileVersion>#<FileVersion>$FILE_VERSION</FileVersion>#" \
          "$VERSION_FILE"
        if [[ "$TARGET" == "MAJOR" ]]; then
          sed -i -E \
            "s#<AssemblyVersion>[0-9]+(\.[0-9]+){3}</AssemblyVersion>#<AssemblyVersion>$ASSEMBLY_VERSION</AssemblyVersion>#" \
            "$VERSION_FILE"
        fi
        if ! grep -Eq "^[[:space:]]*<Version>$VERSION</Version>[[:space:]]*$" "$VERSION_FILE" || ! grep -Eq "^[[:space:]]*<FileVersion>$FILE_VERSION</FileVersion>[[:space:]]*$" "$VERSION_FILE"; then
          echo "FILE VERSION UPDATE FAILED"
          exit 1
        fi
        if [[ "$TARGET" == "MAJOR" ]] && \
           ! grep -Eq "^[[:space:]]*<AssemblyVersion>$ASSEMBLY_VERSION</AssemblyVersion>[[:space:]]*$" "$VERSION_FILE"; then
          echo "ASSEMBLY VERSION UPDATE FAILED"
          exit 1
        fi
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Release Version: $VERSION"
    - name: .NET Setup
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
    - name: Restore
      working-directory: Solution
      run: >-
        dotnet restore
        FastHashes.sln
        --force-evaluate
    - name: Build
      working-directory: Solution
      run: >-
        dotnet build
        FastHashes.sln
        --configuration Release
        --no-restore
        --no-incremental
        --verbosity normal
    - name: Test
      working-directory: Solution
      run: >-
        dotnet run
        --project FastHashes.Tests/FastHashes.Tests.csproj
        --configuration Release
        --no-restore
        --no-build
    - name: Package Preparation
      shell: bash
      env:
        README_FILE: README.md
      run: |
        set -euo pipefail
        if [[ $(grep -c '^<table>$' "$README_FILE") -ne 1 ]] || [[ $(grep -c '^</table>$' "$README_FILE") -ne 1 ]]; then
          echo "README TABLE NOT FOUND OR AMBIGUOUS"
          exit 1
        fi
        sed -i '/^<table>$/,/^<\/table>$/d' "$README_FILE"
        if grep -Eq '^</?table>$' "$README_FILE"; then
          echo "README TABLE REMOVAL FAILED"
          exit 1
        fi
    - name: Package Creation
      working-directory: Solution
      run: >-
        dotnet pack
        FastHashes/FastHashes.csproj
        --configuration Release
        --no-restore
        --no-build
        --output ../Package/
    - name: Package Validation
      run: |
        test -s "Package/FastHashes.$PACKAGE_VERSION.nupkg"
        test -s "Package/FastHashes.$PACKAGE_VERSION.snupkg"
    - name: Package Artifact Upload
      uses: actions/upload-artifact@v4
      with:
        name: Package-${{ steps.bump.outputs.version }}
        path: Package/
        if-no-files-found: error
    - name: Package Publication
      env:
        NUGET_TOKEN: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push \
          "Package/FastHashes.$PACKAGE_VERSION.nupkg" \
          --source https://api.nuget.org/v3/index.json \
          --api-key "$NUGET_TOKEN"
    - name: Version Commit
      run: |
        git config --local user.name "${{ secrets.BOT_USERNAME }}"
        git config --local user.email "${{ secrets.BOT_EMAIL }}"
        git add Solution/Directory.Build.props
        git commit -m "Release $PACKAGE_VERSION"
        git push origin HEAD:master